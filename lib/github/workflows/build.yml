name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.beat.app .
      - run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: |
          for f in $(find ~/.pub-cache -path "*on_audio_query_android*" -name build.gradle); do
            grep -q namespace $f || sed -i "s/^android {/android {\n    namespace 'com.lucasjosino.on_audio_query'/" $f
          done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: beat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
